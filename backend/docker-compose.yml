services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seyra
      POSTGRES_PASSWORD: seyra
      POSTGRES_DB: seyra
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seyra -d seyra"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - seyra_pg:/var/lib/postgresql/data

volumes:
  seyra_pg:
